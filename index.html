<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scientific companion website on freshwater implications of timber city transitions."
    />
    <title>Timber cities and freshwater</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const basePath = "/timbercitiesfreshwater/";
      const isPublishedPath = location.pathname.startsWith(basePath);

      if (!isPublishedPath) {
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/src/main.tsx";
        document.body.appendChild(script);
      } else {
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = `${basePath}assets/app.css`;
        document.head.appendChild(stylesheet);

        const script = document.createElement("script");
        script.type = "module";
        script.src = `${basePath}assets/app.js`;
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
